<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>HAMEN 流体リップル参考デモ</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #07111f;
      color: #edf9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stage { position: relative; height: 100dvh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header, aside, .hint {
      position: absolute;
      z-index: 1;
    }
    header {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
    .sub { margin: 4px 0 0; color: #b9d7e6; font-size: 13px; }
    .notice {
      max-width: 22rem;
      padding: 8px 12px;
      border: 1px solid #765d1a;
      border-radius: 12px;
      background: #251d08;
      color: #ffe7a5;
      font-size: 12px;
      line-height: 1.5;
    }
    aside {
      top: 108px;
      left: max(16px, env(safe-area-inset-left));
      width: min(20.5rem, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid #27495b;
      border-radius: 16px;
      background: rgba(11, 26, 40, 0.88);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    label { display: block; margin-top: 8px; }
    label span { display: flex; justify-content: space-between; font-size: 13px; }
    input[type="range"] { width: 100%; height: 44px; }
    #maps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    #maps button {
      min-width: 44px;
      height: 44px;
      border: 1px solid #4f7688;
      border-radius: 10px;
      background: transparent;
      color: #b9d7e6;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #maps button[aria-checked="true"] {
      border-color: #edf9ff;
      background: #102536;
      color: #edf9ff;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; }
    button#clear {
      border: 1px solid #4f7688;
      border-radius: 999px;
      background: #102536;
      color: #eaf8ff;
      padding: 8px 14px;
      min-height: 36px;
      font-weight: 700;
    }
    .hint {
      left: 0;
      right: 0;
      bottom: 80px;
      text-align: center;
      color: #b9d7e6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="surface" aria-label="流体表面"></canvas>
    <header>
      <div>
        <h1>HAMEN</h1>
        <p class="sub">namioshi向け流体リップル参考デモ。本番ゲームには読み込まれません。</p>
      </div>
      <p class="notice">高さ場の波方程式による見た目の参考です。namioshiの円環物理・得点・入力契約は変更しません。</p>
    </header>
    <aside aria-label="シミュレーション操作">
      <div class="row">
        <strong>表面コントロール</strong>
        <button id="clear" type="button">クリア</button>
      </div>
      <label>
        <span>粘性 <b id="viscosity-value">28</b></span>
        <input id="viscosity" type="range" min="0" max="100" value="28" aria-label="粘性">
      </label>
      <label>
        <span>波の強さ <b id="strength-value">64</b></span>
        <input id="strength" type="range" min="0" max="100" value="64" aria-label="波の強さ">
      </label>
      <p style="margin:12px 0 0;font-size:13px;color:#aacddd">カラーマップ</p>
      <div id="maps" role="radiogroup" aria-label="カラーマップ"></div>
    </aside>
    <p class="hint" id="hint">ドラッグして波を起こす</p>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
